name: Build Mohamed Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - mohamed-chat
    paths:
      - 'app/**'
      - 'assets/**'
      - 'server/**'
      - '.github/workflows/build-mohamed-chat-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: mohamed-chat

      - name: Copy individual visual assets into Flutter asset bundle
        run: |
          mkdir -p assets
          cp -R ../assets/. assets/
          mkdir -p assets/svga
          echo "Asset files copied:"
          find assets -type f | wc -l

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mohamed-chat-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
