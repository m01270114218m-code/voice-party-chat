name: voicechat
description: "VoiceChat — Live Voice Rooms app (Hago/Yalla style)"
publish_to: 'none'
version: 5.0.0+5

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  dio: ^5.4.3
  socket_io_client: ^2.0.3+1
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1
  svgaplayer_flutter: ^2.2.0
  lottie: 2.7.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  path_provider: ^2.1.3
  record: ^6.0.0
  just_audio: ^0.9.38
  image_picker: ^1.1.2
  in_app_purchase: ^3.2.0
  flutter_stripe: ^10.1.1
  google_fonts: ^4.0.4
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/buttons/
    - assets/icons/
    - assets/backgrounds/
    - assets/rooms/
    - assets/avatars/
    - assets/gifts/
    - assets/games/
    - assets/vip/
    - assets/family/
    - assets/pk/
    - assets/luckbox/
    - assets/frames/
    - assets/ui/
    - assets/bubbles/
    - assets/brand/
    - assets/svga/
    - assets/lottie/
    - assets/effects/
